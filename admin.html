<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Guru - SMP Terpadu Nusakarya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #eef2f5;
      color: #333;
    }
    
    .app-header {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      color: white;
      padding: 20px 15px;
      text-align: center;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .school-logo {
      width: 65px;
      height: 65px;
      object-fit: contain;
      margin-bottom: 10px;
      background: white;
      padding: 5px;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .app-header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .app-header p { margin: 4px 0 0 0; font-size: 12px; opacity: 0.9; }

    .container {
      padding: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background-color: #fff;
    }
    .form-control:focus {
      border-color: #2e7d32;
    }

    .tipe-absen-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tipe-option {
      flex: 1;
      text-align: center;
    }
    .tipe-option input[type="radio"] {
      display: none;
    }
    .tipe-option label {
      display: block;
      padding: 12px;
      background: #f0f4f8;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      color: #555;
      transition: all 0.2s;
    }
    .tipe-option input[type="radio"]:checked + label {
      background: #e8f5e9;
      border-color: #2e7d32;
      color: #2e7d32;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px dashed #2e7d32;
    }

    .btn-scan {
      width: 100%;
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      white-space: pre-line;
      display: none;
    }
    .status-msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-msg.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-msg.info { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }

    footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 20px;
      padding-bottom: 25px;
      line-height: 1.6;
    }
    footer .developer-info {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
  </style>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="app-header">
    <img src="logo.jpg" alt="Logo SMP Terpadu Nusakarya" class="school-logo" onerror="if (this.src.endsWith('logo.jpg')) { this.src='logo.jpeg'; } else if (this.src.endsWith('logo.jpeg')) { this.src='logo.png'; }">
    <h1>E-Absensi Guru</h1>
    <p>SMP Terpadu Nusakarya — Presensi Mandiri</p>
  </div>

  <div class="container">
    <div class="card">
      <div class="form-group">
        <label for="selectNamaGuru">Pilih Nama Guru:</label>
        <select id="selectNamaGuru" class="form-control" required>
          <option value="">Memuat daftar guru...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Pilih Tipe Absen:</label>
        <div class="tipe-absen-container">
          <div class="tipe-option">
            <input type="radio" id="absenMasuk" name="tipeAbsen" value="Masuk" checked>
            <label for="absenMasuk">☀️ Absen Masuk</label>
          </div>
          <div class="tipe-option">
            <input type="radio" id="absenPulang" name="tipeAbsen" value="Pulang">
            <label for="absenPulang">🏠 Absen Pulang</label>
          </div>
        </div>
      </div>

      <button id="btnStartScan" class="btn-scan" onclick="mulaiKamera()">
        📷 Buka Kamera & Scan QR
      </button>

      <div id="reader" style="display: none;"></div>

      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <footer>
    Absensi Guru Mobile &copy; 2026 | <strong>SMP Terpadu Nusakarya</strong>
    <div class="developer-info">
      Developed by <strong>TRIHIRA</strong> (Idas)
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA_xvQY0NubGpzBk-5Gm6Z2mqk5_EosNKs",
      authDomain: "absensi-guru-annuur.firebaseapp.com",
      projectId: "absensi-guru-annuur",
      storageBucket: "absensi-guru-annuur.firebasestorage.app",
      messagingSenderId: "1058517577681",
      appId: "1:1058517577681:web:7f2b1e78599b29156c7af0",
      measurementId: "G-YKYQL6NNTS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Default lokasi jika belum disetting di database
    let schoolLat = -7.3500;
    let schoolLng = 108.1100;
    let schoolRadius = 50; // dalam meter

    let html5QrCode;
    let teacherMap = {}; // Penyimpanan data guru berdasarkan nama rapi

    function formatNamaRapi(str) {
      if (!str) return "";
      return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ').trim();
    }

    // PENGATURAN DEVICE ID UNTUK CEK IKATAN HP GURU
    function getDeviceId() {
      let devId = localStorage.getItem("device_id_guru");
      if (!devId) {
        devId = "DEV-" + Math.random().toString(36).substring(2, 9) + "-" + Date.now();
        localStorage.setItem("device_id_guru", devId);
      }
      return devId;
    }

    // INITIAL LOAD: LOKASI SEKOLAH & DAFTAR GURU
    Promise.all([
      db.collection("settings").doc("school_location").get(),
      db.collection("teachers").get()
    ]).then(([locSnap, teachersSnap]) => {
      // 1. Set Lokasi Sekolah
      if (locSnap.exists) {
        const locData = locSnap.data();
        if (locData.latitude && locData.longitude) {
          schoolLat = locData.latitude;
          schoolLng = locData.longitude;
          schoolRadius = locData.radius_meters || 50;
        }
      }

      // 2. Set Daftar Guru
      const select = document.getElementById("selectNamaGuru");
      teacherMap = {};

      teachersSnap.forEach(doc => {
        const data = doc.data();
        if (data.name) {
          const namaRapi = formatNamaRapi(data.name);
          teacherMap[namaRapi] = {
            id: doc.id,
            work_days: data.work_days || ["Senin", "Selasa", "Rabu", "Kamis", "Jumat"],
            device_id: data.device_id || null
          };
        }
      });

      const listGuruNames = Object.keys(teacherMap).sort();

      if (listGuruNames.length === 0) {
        select.innerHTML = '<option value="">-- Belum Ada Daftar Guru --</option>';
      } else {
        select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
        listGuruNames.forEach(guru => {
          select.innerHTML += `<option value="${guru}">${guru}</option>`;
        });
      }
    }).catch(err => {
      document.getElementById("selectNamaGuru").innerHTML = '<option value="">Gagal memuat daftar guru</option>';
    });

    function showStatus(text, type) {
      const msgDiv = document.getElementById("statusMsg");
      msgDiv.className = `status-msg ${type}`;
      msgDiv.innerText = text;
      msgDiv.style.display = "block";
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    function mulaiKamera() {
      const nama = document.getElementById("selectNamaGuru").value;
      if (!nama) {
        alert("Silakan pilih Nama Guru Anda dari daftar dropdown terlebih dahulu!");
        return;
      }

      document.getElementById("reader").style.display = "block";
      document.getElementById("btnStartScan").style.display = "none";
      showStatus("Membuka kamera...", "info");

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess,
        onScanError
      ).catch(err => {
        showStatus("Gagal membuka kamera: " + err, "error");
        document.getElementById("btnStartScan").style.display = "block";
      });
    }

    function onScanError(errorMessage) {}

    function onScanSuccess(decodedText, decodedResult) {
      html5QrCode.stop().then(() => {
        document.getElementById("reader").style.display = "none";
        processAbsensi(decodedText);
      });
    }

    function processAbsensi(scannedCode) {
      const nama = document.getElementById("selectNamaGuru").value;
      const tipeAbsen = document.querySelector('input[name="tipeAbsen"]:checked').value;
      const guruInfo = teacherMap[nama];

      // 1. VALIDASI HARI KERJA
      const daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const hariIni = daftarHari[new Date().getDay()];

      if (guruInfo && guruInfo.work_days && !guruInfo.work_days.includes(hariIni)) {
        showStatus(`⚠️ DITOLAK: Hari ini (${hariIni}) bukan jadwal hari kerja Anda.\nJadwal Anda: ${guruInfo.work_days.join(', ')}`, "error");
        document.getElementById("btnStartScan").style.display = "block";
        return;
      }

      // 2. VALIDASI DEVICE ID (ANTI-TITIP ABSEN)
      const currentDeviceId = getDeviceId();
      if (guruInfo && guruInfo.device_id && guruInfo.device_id !== currentDeviceId) {
        showStatus(`⚠️ DITOLAK: HP ini tidak terdaftar untuk akun ${nama}.\nSilakan gunakan HP Anda yang biasa atau hubungi Admin untuk reset ikatan HP.`, "error");
        document.getElementById("btnStartScan").style.display = "block";
        return;
      }

      showStatus("Memeriksa lokasi GPS Anda...", "info");

      if (!navigator.geolocation) {
        showStatus("Browser Anda tidak mendukung lokasi GPS.", "error");
        document.getElementById("btnStartScan").style.display = "block";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const jarak = hitungJarak(userLat, userLng, schoolLat, schoolLng);
          const jarakBulat = Math.round(jarak);

          // 3. VALIDASI RADIUS GEOLOCATION
          if (jarak > schoolRadius) {
            showStatus(`⚠️ DITOLAK: Anda berada di luar area sekolah!\nJarak Anda saat ini: ${jarakBulat} meter dari sekolah.\nMaksimal jarak yang diizinkan: ${schoolRadius} meter.`, "error");
            document.getElementById("btnStartScan").style.display = "block";
            return;
          }

          // Kunci Device ID jika guru baru pertama kali absen
          if (guruInfo && !guruInfo.device_id) {
            db.collection("teachers").doc(guruInfo.id).update({
              device_id: currentDeviceId
            });
            guruInfo.device_id = currentDeviceId;
          }

          const sekarang = new Date();
          const tanggal = sekarang.toISOString().split('T')[0];
          const jam = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

          db.collection("attendances")
            .where("date", "==", tanggal)
            .get()
            .then((querySnapshot) => {
              const docMatching = querySnapshot.docs.find(doc => formatNamaRapi(doc.data().user_name) === nama);

              if (tipeAbsen === "Masuk") {
                if (docMatching) {
                  const dataLama = docMatching.data();
                  showStatus(`⚠️ DITOLAK: Bpk/Ibu ${nama} SUDAH melakukan Absen Masuk hari ini pada jam ${dataLama.check_in_time}.\n\nSilakan ganti pilihan ke 'Absen Pulang' saat jam pulang nanti.`, "error");
                  document.getElementById("btnStartScan").style.display = "block";
                  return;
                }

                db.collection("attendances").add({
                  user_name: nama,
                  date: tanggal,
                  check_in_time: jam,
                  check_out_time: "-",
                  scanned_code: scannedCode,
                  status: "Hadir",
                  latitude: userLat,
                  longitude: userLng,
                  distance_meter: jarakBulat,
                  timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                  showStatus(`BERHASIL ABSEN MASUK!\nSelamat bertugas, Bpk/Ibu ${nama}.\n(Waktu Masuk: ${jam} | Jarak: ${jarakBulat}m)`, "success");
                  document.getElementById("btnStartScan").style.display = "block";
                  document.getElementById("btnStartScan").innerText = "🔄 Scan Lagi";
                });

              } else if (tipeAbsen === "Pulang") {
                if (!docMatching) {
                  showStatus(`Gagal Pulang: Bpk/Ibu ${nama} belum melakukan Absen Masuk hari ini!`, "error");
                  document.getElementById("btnStartScan").style.display = "block";
                  return;
                }

                db.collection("attendances").doc(docMatching.id).update({
                  check_out_time: jam,
                  check_out_latitude: userLat,
                  check_out_longitude: userLng
                }).then(() => {
                  showStatus(`BERHASIL ABSEN PULANG!\nHati-hati di jalan, Bpk/Ibu ${nama}.\n(Waktu Pulang: ${jam} | Jarak: ${jarakBulat}m)`, "success");
                  document.getElementById("btnStartScan").style.display = "block";
                  document.getElementById("btnStartScan").innerText = "🔄 Scan Lagi";
                });
              }
            })
            .catch(err => {
              showStatus("Terjadi kesalahan: " + err.message, "error");
              document.getElementById("btnStartScan").style.display = "block";
            });
        },
        (error) => {
          showStatus("Gagal mengambil lokasi GPS. Harap aktifkan GPS/Izin Lokasi pada HP Anda!", "error");
          document.getElementById("btnStartScan").style.display = "block";
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
