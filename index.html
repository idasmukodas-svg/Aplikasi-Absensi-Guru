<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Presensi Guru</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">Presensi Guru</h1>
      <span id="clock" class="text-xs bg-indigo-700 px-2 py-1 rounded font-mono">00:00:00</span>
    </div>
  </header>

  
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Card Profil & Device ID -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">Identitas Perangkat</h2>
      <div class="mb-3">
        <label class="block text-xs font-medium text-slate-600 mb-1">Pilih Nama Guru</label>
        <select id="select-guru" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="">-- Pilih Nama Anda --</option>
          <!-- Option diisi dinamis dari Firebase atau statis -->
          <option value="GURU_001">Budi Santoso, S.Pd</option>
          <option value="GURU_002">Siti Rahma, M.Pd</option>
        </select>
      </div>
      <div class="text-xs bg-slate-50 p-2 rounded border border-slate-200 flex justify-between items-center">
        <span class="text-slate-500">Device ID:</span>
        <span id="device-id-display" class="font-mono text-slate-700 font-semibold">Generating...</span>
      </div>
    </div>

    <!-- Card GPS Check -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">Lokasi Terkini</h2>
      <div class="flex items-center justify-between text-xs mb-3">
        <div>
          <p id="geo-status" class="text-slate-600">Mengecek koordinat GPS...</p>
          <p id="geo-distance" class="font-bold text-slate-800 mt-0.5">-</p>
        </div>
        <button onclick="getLokasi()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-300 font-medium transition">
          Refresh GPS
        </button>
      </div>
    </div>

    <!-- Scanner Box -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Scan QR Absensi</h2>
      
      <div id="reader" class="overflow-hidden rounded-lg bg-black text-white min-h-[220px] flex items-center justify-center">
        <span class="text-xs text-slate-400">Kamera belum aktif</span>
      </div>

      <div class="mt-4 flex gap-2">
        <button id="btn-start" onclick="startScanner()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2.5 rounded-lg shadow-sm transition">
          Buka Kamera
        </button>
        <button id="btn-stop" onclick="stopScanner()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm py-2.5 rounded-lg transition hidden">
          Tutup Kamera
        </button>
      </div>
    </div>

    <!-- Status Output -->
    <div id="alert-box" class="p-3 rounded-lg text-xs font-medium text-center hidden"></div>

  </main>

  <script>
    // ----------------------------------------------------
    // 1. KONFIGURASI FIREBASE (Ganti dengan config Anda)
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Inisialisasi Firebase jika config valid
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebaseConfig.apiKey !== "YOUR_API_KEY" ? firebase.firestore() : null;

    // ----------------------------------------------------
    // 2. KORDINAT SEKOLAH & RADIUS (Dalam Meter)
    // ----------------------------------------------------
    const SEKOLAH_LAT = -7.123456; // Ganti Latitude sekolah
    const SEKOLAH_LNG = 107.123456; // Ganti Longitude sekolah
    const MAX_RADIUS = 100; // Radius maksimal dalam meter

    let html5QrCode;
    let userLat = null;
    let userLng = null;
    let deviceUUID = "";

    // ----------------------------------------------------
    // 3. INISIALISASI DEVICE ID & JAM
    // ----------------------------------------------------
    window.addEventListener("DOMContentLoaded", () => {
      initDeviceId();
      getLokasi();
      setInterval(updateClock, 1000);
    });

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
    }

    function initDeviceId() {
      let id = localStorage.getItem("TRIHIRA_DEVICE_ID");
      if (!id) {
        id = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase();
        localStorage.setItem("TRIHIRA_DEVICE_ID", id);
      }
      deviceUUID = id;
      document.getElementById("device-id-display").innerText = id;
    }

    // ----------------------------------------------------
    // 4. LOGIKA GEOFENCING (GPS)
    // ----------------------------------------------------
    function getLokasi() {
      const statusText = document.getElementById("geo-status");
      const distText = document.getElementById("geo-distance");

      if (!navigator.geolocation) {
        statusText.innerText = "GPS tidak didukung browser ini.";
        return;
      }

      statusText.innerText = "Mengambil koordinat...";
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;

          const distance = calculateDistance(userLat, userLng, SEKOLAH_LAT, SEKOLAH_LNG);
          distText.innerText = `Jarak dari sekolah: ${Math.round(distance)} meter`;

          if (distance <= MAX_RADIUS) {
            statusText.innerText = "Status: Dalam Radius Sekolah ✅";
            statusText.className = "text-emerald-600 font-semibold";
          } else {
            statusText.innerText = "Status: Di Luar Radius Sekolah ❌";
            statusText.className = "text-rose-600 font-semibold";
          }
        },
        (error) => {
          statusText.innerText = "Gagal mengambil GPS. Pastikan Izin Akses Aktif.";
          statusText.className = "text-rose-500";
        },
        { enableHighAccuracy: true }
      );
    }

    // Rumus Haversine menghitung jarak meter
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radius bumi dalam meter
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    // ----------------------------------------------------
    // 5. LOGIKA SCANNER QR CODE
    // ----------------------------------------------------
    function startScanner() {
      const idGuru = document.getElementById("select-guru").value;
      if (!idGuru) {
        showAlert("Pilih nama Anda terlebih dahulu!", "error");
        return;
      }

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        onScanSuccess
      ).then(() => {
        document.getElementById("btn-start").classList.add("hidden");
        document.getElementById("btn-stop").classList.remove("hidden");
      }).catch(err => {
        showAlert("Gagal mengakses kamera: " + err, "error");
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById("btn-start").classList.remove("hidden");
          document.getElementById("btn-stop").classList.add("hidden");
        });
      }
    }

    function onScanSuccess(decodedText, decodedResult) {
      stopScanner();
      
      // Validasi Lokasi Sebelum Kirim
      if (userLat === null || userLng === null) {
        showAlert("Lokasi GPS belum terdeteksi!", "error");
        return;
      }

      const distance = calculateDistance(userLat, userLng, SEKOLAH_LAT, SEKOLAH_LNG);
      if (distance > MAX_RADIUS) {
        showAlert(`Gagal Absen: Anda berada di luar area sekolah (${Math.round(distance)}m).`, "error");
        return;
      }

      // Kirim Data Absensi
      prosesAbsensi(decodedText);
    }

    // ----------------------------------------------------
    // 6. PROSES SIMPAN ABSENSI
    // ----------------------------------------------------
    function prosesAbsensi(qrContent) {
      const guruId = document.getElementById("select-guru").value;
      const timestamp = new Date().toISOString();

      const payload = {
        guru_id: guruId,
        device_id: deviceUUID,
        qr_code: qrContent,
        latitude: userLat,
        longitude: userLng,
        created_at: timestamp
      };

      console.log("Data Absen Disimpan:", payload);

      if (db) {
        // Simpan ke Firestore
        db.collection("presensi").add(payload)
          .then(() => {
            showAlert("Absensi Berhasil Dicatat! ✅", "success");
          })
          .catch((error) => {
            showAlert("Gagal menyimpan ke database: " + error.message, "error");
          });
      } else {
        // Simulasikan jika Firebase belum diisi
        showAlert(`[Demo Mode] Absensi Berhasil untuk ID: ${guruId} ✅`, "success");
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById("alert-box");
      box.classList.remove("hidden", "bg-emerald-100", "text-emerald-800", "bg-rose-100", "text-rose-800");

      if (type === "success") {
        box.classList.add("bg-emerald-100", "text-emerald-800");
      } else {
        box.classList.add("bg-rose-100", "text-rose-800");
      }

      box.innerText = msg;
    }
  </script>
</body>
</html>
